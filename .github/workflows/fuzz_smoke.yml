name: Fuzz Smoke

# Smoke-fuzzes the only parsers in this repository fed arbitrary untrusted
# text: the slice-gate extractors that read user-authored issue bodies. The
# invariant is that they always return rather than raise -- a parser that
# raises on a malformed issue turns an authoring mistake into a crashed
# required gate.
#
# Not a required check: a fuzz run is a search, and a search that finds
# nothing this minute is not evidence the same as a deterministic gate.

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

jobs:
  fuzz_smoke:
    name: fuzz_smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install the fuzzing engine and gate toolchain
        run: |
          python -m pip install --require-hashes -r requirements/ci/gate-tools.txt
          python -m pip install --require-hashes -r requirements/ci/fuzz-tools.txt

      - name: Fuzz the issue-body parsers
        run: |
          python fuzz/fuzz_issue_body.py \
            -max_total_time=60 -max_len=4096 -timeout=30 -rss_limit_mb=2560
